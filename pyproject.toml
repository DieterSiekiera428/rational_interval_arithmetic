[project]
name = "rational-interval-arithmetic"
version = "0.1.0"
description = "Computes guaranteed bounds on arithmetic operations over intervals where endpoints are exact rationals, using the fractions module."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
